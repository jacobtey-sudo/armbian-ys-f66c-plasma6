# Plasma 6 image for the YS-F66C tablet.
# Board support and the console base come from armbian-ys-f66c.

BOARD="ys-f66c"
BRANCH="vendor"
RELEASE="trixie"
BUILD_DESKTOP="yes"
BUILD_MINIMAL="no"
DESKTOP_ENVIRONMENT="kde-plasma"
DESKTOP_TIER="minimal"
KERNEL_CONFIGURE="no"
KERNEL_BTF="no"

# Desktop packages and KDE/SDDM hooks live in this extension.
enable_extension "ys-f66c-plasma6"