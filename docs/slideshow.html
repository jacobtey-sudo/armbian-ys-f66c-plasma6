<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YS-F66C: Plasma 6 — скриншоты</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: #17181c;
    color: #d7d8dd;
    font: 15px/1.4 system-ui, "Noto Sans", sans-serif;
  }
  #slide {
    display: block;
    max-width: 100%;
    max-height: calc(100vh - 130px);
    border-radius: 8px;
    background: #000;
    box-shadow: 0 10px 30px #0009;
    cursor: pointer;
  }
  nav { display: flex; align-items: center; gap: 14px; }
  button {
    width: 56px;
    height: 40px;
    font-size: 20px;
    color: inherit;
    background: #26272d;
    border: 1px solid #3a3c44;
    border-radius: 8px;
    cursor: pointer;
  }
  button:hover { background: #31333a; }
  button:active { background: #3b3d45; }
  #counter { min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<img id="slide" src="images/plasma-desktop.png" alt="Рабочий стол Plasma 6">
<nav>
  <button id="prev" type="button" aria-label="Предыдущий снимок">←</button>
  <span id="counter">1 / 3</span>
  <button id="next" type="button" aria-label="Следующий снимок">→</button>
</nav>
<script>
const slides = [
  ["images/plasma-desktop.png", "Рабочий стол Plasma 6"],
  ["images/maliit-osk.png", "Экранная клавиатура Maliit"],
  ["images/app-dashboard.png", "Меню приложений"]
];
const img = document.getElementById("slide");
const counter = document.getElementById("counter");
let i = 0;
let touchX = null;
let swiped = false;

for (const [src] of slides) new Image().src = src;

function show(n) {
  i = (n + slides.length) % slides.length;
  img.src = slides[i][0];
  img.alt = slides[i][1];
  counter.textContent = (i + 1) + " / " + slides.length;
}

document.getElementById("prev").onclick = () => show(i - 1);
document.getElementById("next").onclick = () => show(i + 1);

img.onclick = () => {
  if (swiped) { swiped = false; return; }
  show(i + 1);
};

img.addEventListener("touchstart", (e) => { touchX = e.touches[0].clientX; }, { passive: true });
img.addEventListener("touchend", (e) => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  touchX = null;
  if (Math.abs(dx) < 40) return;
  swiped = true;
  show(dx < 0 ? i + 1 : i - 1);
}, { passive: true });

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") show(i - 1);
  if (e.key === "ArrowRight") show(i + 1);
});
</script>
</body>
</html>
